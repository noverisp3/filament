[package]
name = "filament"
version = "0.1.2"
edition = "2024"
description = "A Minecraft server, written from scratch in Rust"
license = "MIT"
repository = "https://github.com/noverisp3/filament"
readme = "README.md"
keywords = ["minecraft", "server", "protocol"]
categories = ["game-development", "network-programming"]

# `extracted/` is the data generator's output, eight megabytes of it, and is not
# read at build time: the tables that are read live in `assets/` as bytes the
# crate embeds, and `src/generated/` as Rust. `tools/` is the capture scripts
# that produced them, which belong to the repository rather than to anyone
# depending on the crate.
exclude = ["extracted/**", "tools/**"]

# Both a library and a binary. The library is what the tests exercise and what
# the server logic lives in; the binary is only the argument parsing and the
# startup message around it.
[lib]
name = "filament"
path = "src/lib.rs"

[[bin]]
name = "filament"
path = "src/main.rs"

[dependencies]
# `world/` is pure std today, and that is deliberate. Storage, light
# propagation and meshing are the parts worth being able to unit test without a
# window, a GPU or a network, and an engine that claims to be multithreaded
# should not be holding a handle to a render device from its storage layer.
#
# `bytemuck` is the one exception, and only for the derive on the vertex
# struct. That struct is the layout handed to the GPU, and `bytemuck`'s
# guarantee that the Rust layout matches the bytes is the point: getting that
# wrong silently corrupts every chunk sent to a player.
bytemuck = { version = "1.25.2", features = ["derive"] }

# zlib, which is what Minecraft compresses packets with once a threshold is set.
# The client will not accept a stream that is not deflate-compatible, so this is
# not an implementation choice.
flate2 = "1.1"

# Only used by tests, to check the status JSON is well-formed by parsing it
# back. Escaping is easy to get subtly wrong and a broken status document makes
# the client report the server as unreachable rather than as badly formatted.
serde_json = "1.0"

# MD5, and only to reproduce Mojang's offline UUID: `UUID.nameUUIDFromBytes`
# is defined in terms of it. Not used for anything security related, since the
# input is a name the client already chose.
md-5 = "0.10"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3